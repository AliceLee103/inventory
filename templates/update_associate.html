{% extends "base.html" %}

{% block title %}Update Associate - Inventory Management System{% endblock %}

{% block content %}
<h1>Update Associate</h1>

<form method="POST">
    <div class="form-group">
        <label>User ID:</label>
        <input type="text" value="{{ associate.user_id }}" disabled>
        <small style="color: #666;">User ID cannot be changed</small>
    </div>
    
    <div class="form-group">
        <label for="department">Department:</label>
        <input type="text" id="department" name="department" value="{{ associate.department }}" required>
    </div>
    
    <div class="form-group">
        <label for="job_title">Job Title:</label>
        <input type="text" id="job_title" name="job_title" value="{{ associate.job_title }}" required>
    </div>
    
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ associate.email }}" required>
    </div>
    
    <div>
        <button type="submit" class="btn btn-success">Update Associate</button>
        <a href="{{ url_for('list_associates') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
