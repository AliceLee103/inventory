{% extends "base.html" %}

{% block title %}Add Associate - Inventory Management System{% endblock %}

{% block content %}
<h1>Add New Associate</h1>

<form method="POST">
    <div class="form-group">
        <label for="user_id">User ID:</label>
        <input type="text" id="user_id" name="user_id" required placeholder="e.g., john.doe">
    </div>
    
    <div class="form-group">
        <label for="department">Department:</label>
        <input type="text" id="department" name="department" required placeholder="e.g., Engineering, IT, Marketing">
    </div>
    
    <div class="form-group">
        <label for="job_title">Job Title:</label>
        <input type="text" id="job_title" name="job_title" required placeholder="e.g., Software Engineer, Manager">
    </div>
    
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="e.g., john.doe@company.com">
    </div>
    
    <div>
        <button type="submit" class="btn btn-success">Add Associate</button>
        <a href="{{ url_for('list_associates') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
